<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Impressum — REP</title>
    <style>
      :root {
        --bg: #f8f9fa;
        --primary: #2a6f97;
        --accent: #4ecda4;
        --text: #1a1a1a;
        --text-muted: #5c6670;
        --border: #e2e6ea;
        --radius: 16px;
        --max-width: 480px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: 100%;
        max-width: var(--max-width);
        padding: 24px 24px 48px;
      }

      .back-link {
        display: inline-block;
        margin-bottom: 28px;
        font-size: 0.9375rem;
        font-weight: 500;
        color: var(--primary);
        text-decoration: none;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      .back-link:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }

      .legal-content {
        text-align: left;
        line-height: 1.6;
        color: var(--text);
      }

      .legal-content h1 {
        margin: 0 0 1.25rem;
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.25;
        color: var(--text);
      }

      .legal-content p {
        margin: 0 0 1rem;
        color: var(--text);
      }

      .legal-content a {
        color: var(--primary);
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .legal-content a:hover {
        color: #245f82;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <a class="back-link" href="index.html">← Back</a>

      <article class="legal-content">
        <h1>Impressum</h1>
        <p>
          Angaben gemäß § 5 TMG<br />
          Christoph Leon Straßenberger<br />
          Siegersbacherstraße 30<br />
          94419 Reisbach
        </p>
        <p>
          Kontakt:<br />
          E-Mail:
          <a href="mailto:hello@stratoph.com">hello@stratoph.com</a>
        </p>
      </article>
    </main>
  </body>
</html>
