<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Agirep is an app for tracking your real-world social interactions. Log your reps and follow your social progress over time."
    />
    <title>Agirep — Social Fitness Tracker</title>
    <style>
      :root {
        --bg: #f8f9fa;
        --primary: #2a6f97;
        --accent: #4ecda4;
        --text: #1a1a1a;
        --text-muted: #5c6670;
        --border: #e2e6ea;
        --max-width: 480px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: 100%;
        max-width: var(--max-width);
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 48px 24px 32px;
        text-align: center;
      }

      .logo {
        width: 120px;
        height: auto;
        margin-bottom: 32px;
      }

      .tagline {
        margin: 0 0 16px;
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.25;
        color: var(--text);
      }

      .description {
        margin: 0 0 40px;
        font-size: 1rem;
        line-height: 1.6;
        color: var(--text-muted);
        max-width: 36ch;
      }

      .availability {
        margin: 0;
        font-size: 0.875rem;
        color: var(--text-muted);
      }

      .availability::before {
        content: '';
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 8px;
        border-radius: 50%;
        background: var(--accent);
        vertical-align: middle;
        position: relative;
        top: -1px;
      }

      .site-footer {
        width: 100%;
        max-width: var(--max-width);
        padding: 24px 24px 32px;
        text-align: center;
      }

      .footer-links {
        margin: 0;
        font-size: 0.8125rem;
        color: var(--text-muted);
        line-height: 1.8;
      }

      .footer-links a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 500;
      }

      .footer-links a:hover {
        text-decoration: underline;
      }

      .footer-links .sep {
        margin: 0 0.35em;
        color: var(--border);
        user-select: none;
      }

      @media (min-width: 400px) {
        .tagline {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <img
        class="logo"
        src="../assets/images/rep-logo.png"
        width="240"
        height="240"
        alt="Agirep"
      />

      <h1 class="tagline">Build your social strength.</h1>

      <p class="description">
        Social skills are trainable. Agirep lets you track your real-world social
        interactions and follow your progress over time.
      </p>

      <p class="availability">Available soon on iOS and Android</p>
    </main>

    <footer class="site-footer">
      <p class="footer-links">
        <a href="privacy.html">Privacy Policy</a
        ><span class="sep" aria-hidden="true">·</span
        ><a href="terms.html">Terms of Service</a
        ><span class="sep" aria-hidden="true">·</span
        ><a href="impressum.html">Impressum</a>
      </p>
    </footer>
  </body>
</html>
