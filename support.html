<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Get support for Agirep — contact us with questions or feedback."
    />
    <title>Support — Agirep</title>
    <style>
      :root {
        --bg: #f8f9fa;
        --primary: #2a6f97;
        --accent: #4ecda4;
        --text: #1a1a1a;
        --text-muted: #5c6670;
        --border: #e2e6ea;
        --max-width: 480px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: 100%;
        max-width: var(--max-width);
        flex: 1;
        padding: 24px 24px 32px;
      }

      .back-link {
        display: inline-block;
        margin-bottom: 28px;
        font-size: 0.9375rem;
        font-weight: 500;
        color: var(--primary);
        text-decoration: none;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      .back-link:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }

      .content {
        text-align: left;
        line-height: 1.6;
        color: var(--text);
      }

      .content h1 {
        margin: 0 0 1.25rem;
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.25;
        color: var(--text);
      }

      .content p {
        margin: 0;
        color: var(--text-muted);
      }

      .content a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 500;
      }

      .content a:hover {
        text-decoration: underline;
      }

      .site-footer {
        width: 100%;
        max-width: var(--max-width);
        padding: 24px 24px 32px;
        text-align: center;
      }

      .footer-links {
        margin: 0;
        font-size: 0.8125rem;
        color: var(--text-muted);
        line-height: 1.8;
      }

      .footer-links a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 500;
      }

      .footer-links a:hover {
        text-decoration: underline;
      }

      .footer-links .sep {
        margin: 0 0.35em;
        color: var(--border);
        user-select: none;
      }

      @media (min-width: 400px) {
        .content h1 {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <a class="back-link" href="index.html">← Back</a>

      <article class="content">
        <h1>Support</h1>
        <p>
          Have a question, feedback, or need help with Agirep? Reach out and
          we&apos;ll get back to you as soon as we can at
          <a href="mailto:hello@stratoph.com">hello@stratoph.com</a>.
        </p>
      </article>
    </main>

    <footer class="site-footer">
      <p class="footer-links">
        <a href="privacy.html">Privacy Policy</a
        ><span class="sep" aria-hidden="true">·</span
        ><a href="terms.html">Terms of Service</a
        ><span class="sep" aria-hidden="true">·</span
        ><a href="impressum.html">Impressum</a
        ><span class="sep" aria-hidden="true">·</span
        ><a href="support.html">Support</a>
      </p>
    </footer>
  </body>
</html>
